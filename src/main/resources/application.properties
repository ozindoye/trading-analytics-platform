# --- H2 file-based database (local dev), persisted under ./data ---
spring.datasource.url=jdbc:h2:file:./data/tradingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Twelve Data ---
twelvedata.base-url=https://api.twelvedata.com
# Pull in the git-ignored local file that holds the API key.
# "optional:" means no error if the file is absent (fresh clone / production).
spring.config.import=optional:application-local.properties

# --- Server port: Railway injects PORT; falls back to 8080 locally ---
server.port=${PORT:8080}